name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install --require-hashes -r requirements.lock -r api-translate-rt/requirements.lock
      - run: pip install pytest==9.1.1 httpx==0.28.1 ruff==0.14.1 pip-audit==2.10.0
      - run: ruff check --select E9,F63,F7,F82 app.py frontend_security.py api-translate-rt
      - run: python -m pytest -q api-translate-rt/tests
      - run: node --check static/js/code.js && node --test tests/frontend.test.cjs
      - run: pip-audit -r requirements.lock -r api-translate-rt/requirements.lock
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks detect --source . --log-opts=--all --redact --no-banner
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t translate-rt:ci .
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: translate-rt:ci
          severity: CRITICAL
          exit-code: '1'

  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nginx openssl
      - run: sudo python3 tests/check_nginx.py
