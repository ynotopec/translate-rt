# Standalone example: adapt names/certificates and merge into your existing Nginx.
# Do not replace a shared host's nginx.conf wholesale.
worker_processes auto;
pid /tmp/translate-rt-nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 12m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    limit_req_zone $binary_remote_addr zone=frontend:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=backend:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_req_status 429;
    limit_conn_status 429;
    # Keep query strings, Authorization and bodies out of access logs.
    log_format minimal '$remote_addr $request_method $uri $status $request_time';
    access_log /var/log/nginx/translate-rt-access.log minimal;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/translate-rt/tls/fullchain.pem;
    ssl_certificate_key /etc/translate-rt/tls/privkey.pem;

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 80;
        server_name app.example.com api-app.example.com;
        # If using HTTP-01 ACME, add your ACME challenge location here.
        location / { return 308 https://$host$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name app.example.com;
        limit_req zone=frontend burst=20 nodelay;
        limit_conn connections 20;
        # Enforced by the TLS edge for redirects and Nginx-generated errors too.
        add_header Strict-Transport-Security 'max-age=31536000' always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host app.example.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            # Upstream Flask creates the nonce-based CSP; do not overwrite it.
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Server;
            proxy_connect_timeout 5s;
            proxy_read_timeout 180s;
            proxy_send_timeout 30s;
        }
    }
    server {
        listen 443 ssl;
        server_name api-app.example.com;
        limit_req zone=backend burst=20 nodelay;
        limit_conn connections 20;
        add_header Strict-Transport-Security 'max-age=31536000' always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host api-app.example.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_hide_header Server;
            proxy_connect_timeout 5s;
            proxy_read_timeout 180s;
            # API Authorization is checked by FastAPI. Do not substitute the
            # frontend's Basic credentials or disable backend token checking.
        }
    }
}
